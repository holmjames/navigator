name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q
      - name: no secrets in the repo
        run: |
          ! grep -rIE --exclude-dir=.git --exclude-dir=.github "(gtms_[A-Za-z0-9_-]{16,}|ms_[A-Za-z0-9]{16,}|sk-[A-Za-z0-9]{20,}|xoxb-[0-9A-Za-z-]{20,})" .
